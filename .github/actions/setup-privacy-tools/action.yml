name: Setup package privacy tools
description: Install a digest-pinned extractor with RPM Zstandard support
runs:
  using: composite
  steps:
    - name: Install verified 7-Zip and package inspection tools
      shell: bash
      run: |
        set -euo pipefail
        [[ "$(uname -s)" == Linux && "$(uname -m)" == x86_64 ]]
        directory="$RUNNER_TEMP/ieum-privacy-7zip-26.03"
        mkdir -p "$directory"
        archive="$directory/7z2603-linux-x64.tar.xz"
        curl --fail --silent --show-error --location \
          --proto '=https' --proto-redir '=https' --retry 3 \
          'https://github.com/ip7z/7zip/releases/download/26.03/7z2603-linux-x64.tar.xz' \
          --output "$archive"
        printf '%s  %s\n' \
          'dc99eff5008f1ab79bd7084c68513701547a808a89502bf4133683535ab3c695' \
          "$archive" | sha256sum --check --strict -
        tar -xJf "$archive" -C "$directory" 7zz
        "$directory/7zz" i
        printf '%s\n' "$directory" >> "$GITHUB_PATH"
        command -v zstd >/dev/null
        if ! command -v flatpak >/dev/null || ! command -v ostree >/dev/null; then
          sudo apt-get update -qq
          sudo apt-get install -y --no-install-recommends flatpak ostree
        fi
        command -v flatpak >/dev/null
        command -v ostree >/dev/null
