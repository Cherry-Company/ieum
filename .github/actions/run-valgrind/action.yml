name: "Run Valgrind"
description: "Runs Valgrind against a specified target and parses a summary"

inputs:
  executable:
    description: "The executable to run under Valgrind"
    required: true
  log-file:
    description: "A unique path for the Valgrind log"
    required: false
    default: "valgrind.log"

outputs:
  summary:
    description: "The parsed Valgrind summary"
    value: ${{ steps.parse.outputs.summary }}
  exit-code:
    description: "The Valgrind or target process exit code"
    value: ${{ steps.run.outputs.exit_code }}

runs:
  using: "composite"

  steps:
    - name: Valgrind
      id: run
      env:
        QT_QPA_PLATFORM: offscreen
        VALGRIND_EXECUTABLE: ${{ inputs.executable }}
        VALGRIND_LOG_FILE: ${{ inputs.log-file }}
      run: |
        set +e
        set -o pipefail

        # Definite and indirect leaks fail the run. Ambiguous possible leaks and
        # process-lifetime still-reachable allocations are reported but allowed.
        # Only Valgrind's reviewed built-in suppressions are enabled; there are
        # no project-wide custom suppressions hiding application frames.
        valgrind \
          --error-exitcode=97 \
          --leak-check=full \
          --show-leak-kinds=all \
          --errors-for-leak-kinds=definite,indirect \
          --default-suppressions=yes \
          --track-origins=yes \
          -- "$VALGRIND_EXECUTABLE" \
          2>&1 | tee "$VALGRIND_LOG_FILE"
        exit_code=$?

        set -e
        printf 'exit_code=%s\n' "$exit_code" >> "$GITHUB_OUTPUT"
      shell: bash

    - name: Parse output
      id: parse
      env:
        VALGRIND_LOG_FILE: ${{ inputs.log-file }}
      run: |
        {
          echo "summary<<VALGRIND_SUMMARY_EOF"
          if grep -q "HEAP SUMMARY:" "$VALGRIND_LOG_FILE"; then
            grep -A 2 "HEAP SUMMARY:" "$VALGRIND_LOG_FILE"
            echo
            awk '/LEAK SUMMARY/,/ERROR SUMMARY/' "$VALGRIND_LOG_FILE"
          else
            tail -n 40 "$VALGRIND_LOG_FILE"
          fi
          echo "VALGRIND_SUMMARY_EOF"
        } >> "$GITHUB_OUTPUT"
      shell: bash

    - name: Enforce Valgrind result
      env:
        VALGRIND_EXIT_CODE: ${{ steps.run.outputs.exit_code }}
      run: |
        if [[ ! "$VALGRIND_EXIT_CODE" =~ ^[0-9]+$ ]]; then
          echo "::error::Valgrind did not report a valid exit code"
          exit 1
        fi
        if [[ "$VALGRIND_EXIT_CODE" != "0" ]]; then
          echo "::error::Valgrind or its target failed with exit code $VALGRIND_EXIT_CODE"
        fi
        exit "$VALGRIND_EXIT_CODE"
      shell: bash
