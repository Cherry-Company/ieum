# All-in-one continuous integration (CI) workflow.
# Runs on all platforms (Windows, macOS, and Linux)
# for all events (pull request, release, and schedule).

name: Continuous Integration

on:
  push:
    branches: ["ieum/main"]
    tags:
      - "v*"
  pull_request:
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

env:
  GIT_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
  PACKAGE_PREFIX: "Ieum"
  PACKAGE_PATH: ./dist
  CMAKE_CONFIGURE: "cmake -Bbuild -DCMAKE_BUILD_TYPE=Release -DSKIP_BUILD_TESTS=ON -DCMAKE_COMPILE_WARNING_AS_ERROR=ON"

jobs:
  # Quality gate to allow PR merge, used in the branch protection rules.
  ci-passed:
    runs-on: ubuntu-latest
    needs: [privacy-guard, workflow-policy, analyze-valgrind, main-build, test-results, unix, flatpak]
    if: always()

    steps:
      - name: Check all steps passed
        env:
          EVENT_NAME: ${{ github.event_name }}
          PRIVACY_RESULT: ${{ needs.privacy-guard.result }}
          WORKFLOW_POLICY_RESULT: ${{ needs.workflow-policy.result }}
          VALGRIND_RESULT: ${{ needs.analyze-valgrind.result }}
          MAIN_BUILD_RESULT: ${{ needs.main-build.result }}
          TEST_RESULTS_RESULT: ${{ needs.test-results.result }}
          UNIX_RESULT: ${{ needs.unix.result }}
          FLATPAK_RESULT: ${{ needs.flatpak.result }}
        run: |
          set -euo pipefail

          valgrind_ok=false
          if [[ "$EVENT_NAME" == "pull_request" && "$VALGRIND_RESULT" == "success" ]]; then
            valgrind_ok=true
          elif [[ "$EVENT_NAME" != "pull_request" && "$VALGRIND_RESULT" == "skipped" ]]; then
            valgrind_ok=true
          fi

          if [[ "$PRIVACY_RESULT" == "success" && \
                "$WORKFLOW_POLICY_RESULT" == "success" && \
                "$valgrind_ok" == "true" && \
                "$MAIN_BUILD_RESULT" == "success" && \
                "$TEST_RESULTS_RESULT" == "success" && \
                "$UNIX_RESULT" == "success" && \
                "$FLATPAK_RESULT" == "success" ]]; then
            echo "✅ CI passed" > "$GITHUB_STEP_SUMMARY"
          else
            exit 1
          fi

  privacy-guard:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read

    steps:
      - name: Checkout complete history
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Materialize private deny map
        shell: bash
        env:
          DENY_MAP_B64: ${{ secrets.IEUM_PRIVATE_DENY_MAP_B64 }}
          DENY_MAP_SHA256: ${{ secrets.IEUM_PRIVATE_DENY_MAP_SHA256 }}
        run: |
          set -euo pipefail
          [[ -n "$DENY_MAP_B64" && "$DENY_MAP_SHA256" =~ ^[0-9a-f]{64}$ ]] || {
            echo "::error::The private deny map and its frozen SHA-256 are required."
            exit 1
          }
          deny_map="$RUNNER_TEMP/ieum-private-deny-map.json"
          printf '%s' "$DENY_MAP_B64" | base64 --decode > "$deny_map"
          chmod 600 "$deny_map"
          printf 'IEUM_PRIVATE_DENY_MAP=%s\n' "$deny_map" >> "$GITHUB_ENV"
          printf 'IEUM_PRIVATE_DENY_MAP_SHA256=%s\n' "$DENY_MAP_SHA256" >> "$GITHUB_ENV"

      - name: Run synthetic guard and hook regressions
        run: python3 -m unittest discover -s tools/privacy/tests -p 'test_*.py' -v

      - name: Check exact upstream documentation link
        run: python3 tools/privacy/check_public_links.py --online

      - name: Resolve reviewed range baseline
        id: privacy-baseline
        shell: bash
        env:
          EVENT_NAME: ${{ github.event_name }}
          PR_BASE_SHA: ${{ github.event.pull_request.base.sha }}
          PUSH_BEFORE_SHA: ${{ github.event.before }}
          FROZEN_BASELINE_SHA: ${{ secrets.IEUM_PRIVACY_BASELINE_SHA }}
        run: |
          set -euo pipefail
          baseline=""
          if [[ "$EVENT_NAME" == "pull_request" ]]; then
            baseline="$PR_BASE_SHA"
          elif [[ -n "$PUSH_BEFORE_SHA" && ! "$PUSH_BEFORE_SHA" =~ ^0+$ ]]; then
            baseline="$PUSH_BEFORE_SHA"
          else
            baseline="$FROZEN_BASELINE_SHA"
          fi
          [[ "$baseline" =~ ^[0-9a-f]{40}$|^[0-9a-f]{64}$ ]] || {
            echo "::error::A reviewed clean baseline is required."
            exit 1
          }
          git cat-file -e "$baseline^{commit}"
          printf 'baseline=%s\n' "$baseline" >> "$GITHUB_OUTPUT"

      - name: Scan exact candidate tree
        run: |
          python3 tools/privacy/public_privacy_guard.py tree \
            --repo . \
            --treeish HEAD \
            --deny-map "$IEUM_PRIVATE_DENY_MAP" \
            --deny-map-sha256 "$IEUM_PRIVATE_DENY_MAP_SHA256" \
            --manifest-out "$RUNNER_TEMP/privacy-tree.json"

      - name: Scan introduced commit range
        run: |
          python3 tools/privacy/public_privacy_guard.py range \
            --repo . \
            --baseline "${{ steps.privacy-baseline.outputs.baseline }}" \
            --head HEAD \
            --deny-map "$IEUM_PRIVATE_DENY_MAP" \
            --deny-map-sha256 "$IEUM_PRIVATE_DENY_MAP_SHA256" \
            --manifest-out "$RUNNER_TEMP/privacy-range.json"

      - name: Report safe privacy finding metadata
        if: failure()
        shell: bash
        run: |
          for manifest in "$RUNNER_TEMP/privacy-tree.json" "$RUNNER_TEMP/privacy-range.json"; do
            if [[ -f "$manifest" ]]; then
              python3 tools/privacy/report_public_manifest.py "$manifest"
            fi
          done

  workflow-policy:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read

    steps:
      - name: Checkout
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6

      - name: Run workflow policy regressions
        run: python3 -m unittest discover -s tools/ci/tests -p 'test_*.py' -v

  # Summary of test results, combined from test result artifacts.
  # Runs even if the tests fail to provide a summary of the failures.
  test-results:
    needs: main-build
    if: always() && needs.main-build.result != 'skipped'

    runs-on: ubuntu-slim
    timeout-minutes: 5

    steps:
      - name: Checkout
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6

      - name: Test summary
        uses: ./.github/actions/test-summary

  lint-reuse:
    runs-on: ubuntu-latest
    timeout-minutes: 5

    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6

      - name: REUSE Compliance Check
        uses: fsfe/reuse-action@bb774aa972c2a89ff34781233d275075cbddf542 # v5

      - name: Validate sponsorship transparency note
        if: startsWith(github.ref, 'refs/tags/v')
        shell: bash
        run: |
          if ! grep -Fxq "Release: ${{ github.ref_name }}" docs/release/sponsorship-impact.md; then
            echo "::error::Update docs/release/sponsorship-impact.md for ${{ github.ref_name }} before tagging."
            exit 1
          fi

  lint-clang:
    needs: [lint-reuse]
    runs-on: ubuntu-slim
    timeout-minutes: 5

    steps:
      - name: Checkout
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6

      - name: Lint Checker
        uses: ./.github/actions/lint-clang

  analyze-valgrind:
    needs: lint-clang
    if: ${{ github.event_name == 'pull_request' }}
    uses: ./.github/workflows/valgrind-analysis.yml

  main-build:
    needs: lint-clang
    name: ${{ matrix.target.name }}
    runs-on: ${{ matrix.target.runs-on }}
    container: ${{ matrix.target.container }}
    timeout-minutes: ${{ matrix.target.timeout }}
    strategy:
      # Normally, we want to fail fast, but in this case we shouldn't since one target may
      # fail due to transient issues unrelated to the build.
      fail-fast: false

      matrix:
        target:
          - name: "windows-2022-x64"
            runs-on: "windows-2022"
            timeout: 30
            config-args: "-G Ninja"
            vcpkg-triplet: x64-windows-release
            arch: "amd64"
            qt-version: 6.10.3

          - name: "windows-2022-arm64"
            runs-on: "windows-11-arm"
            timeout: 30
            config-args: "-G Ninja"
            vcpkg-triplet: arm64-windows
            arch: "arm64"
            qt-version: 6.11.1

          - name: "macos-arm64"
            # Public-repository packaging uses an ephemeral hosted Apple Silicon runner.
            # Hardware acceptance testing remains separate from release packaging.
            runs-on: macos-15
            timeout: 60
            qt-version: 6.11.1
            config-args: '-DCMAKE_OSX_ARCHITECTURES="arm64" -DCMAKE_OSX_DEPLOYMENT_TARGET=14'

          - name: "macos-x64"
            runs-on: macos-15-intel
            timeout: 20
            qt-version: 6.9.3
            config-args: '-DCMAKE_OSX_ARCHITECTURES="x86_64" -DCMAKE_OSX_DEPLOYMENT_TARGET=12 -DCMAKE_OSX_SYSROOT=/Applications/Xcode_16.4.app/Contents/Developer/Platforms/MacOSX.platform/Developer/SDKs/MacOSX.sdk'

          - name: "debian-x86_64"
            runs-on: ubuntu-latest
            container: debian:stable-slim
            like: "debian"
            timeout: 20
            config-args: "-G Ninja -DCMAKE_INSTALL_PREFIX=/usr"

          - name: "debian-arm64"
            runs-on: ubuntu-24.04-arm
            container: debian:stable-slim
            like: "debian"
            timeout: 20
            config-args: "-G Ninja -DCMAKE_INSTALL_PREFIX=/usr"

          - name: "debian-testing-x86_64"
            runs-on: ubuntu-latest
            container: debian:testing-slim
            like: "debian"
            timeout: 20
            config-args: "-G Ninja -DCMAKE_INSTALL_PREFIX=/usr"

          - name: "debian-testing-arm64"
            runs-on: ubuntu-24.04-arm
            container: debian:testing-slim
            like: "debian"
            timeout: 20
            config-args: "-G Ninja -DCMAKE_INSTALL_PREFIX=/usr"

          - name: "fedora-43-x86_64"
            runs-on: ubuntu-latest
            container: fedora:43
            like: "fedora"
            timeout: 20
            config-args: "-G Ninja -DCMAKE_INSTALL_PREFIX=/usr"

          - name: "fedora-43-arm64"
            runs-on: ubuntu-24.04-arm
            container: fedora:43
            like: "fedora"
            timeout: 20
            config-args: "-G Ninja -DCMAKE_INSTALL_PREFIX=/usr"

          - name: "fedora-44-x86_64"
            runs-on: ubuntu-latest
            container: fedora:44
            like: "fedora"
            timeout: 20
            config-args: "-G Ninja -DCMAKE_INSTALL_PREFIX=/usr"

          - name: "fedora-44-arm64"
            runs-on: ubuntu-24.04-arm
            container: fedora:44
            like: "fedora"
            timeout: 20
            config-args: "-G Ninja -DCMAKE_INSTALL_PREFIX=/usr"

          - name: "opensuse-x86_64"
            runs-on: ubuntu-latest
            container: opensuse/tumbleweed:latest
            like: "suse"
            timeout: 20
            config-args: "-G Ninja -DCMAKE_INSTALL_PREFIX=/usr"

          - name: "opensuse-arm64"
            runs-on: ubuntu-24.04-arm
            container: opensuse/tumbleweed:latest
            like: "suse"
            timeout: 20
            config-args: "-G Ninja -DCMAKE_INSTALL_PREFIX=/usr"

          - name: "archlinux-x86_64"
            runs-on: ubuntu-latest
            container: archlinux:latest
            like: "arch"
            timeout: 20
            config-args: "-G Ninja -DCMAKE_INSTALL_PREFIX=/usr -DBUILD_DEV_DOCS=ON"

          - name: "ubuntu-26.04-x86_64"
            runs-on: ubuntu-latest
            container: ubuntu:26.04
            like: "debian"
            timeout: 30
            config-args: "-G Ninja -DCMAKE_INSTALL_PREFIX=/usr"

          - name: "ubuntu-26.04-arm64"
            runs-on: ubuntu-24.04-arm
            container: ubuntu:26.04
            like: "debian"
            timeout: 20
            config-args: "-G Ninja -DCMAKE_INSTALL_PREFIX=/usr"

    steps:
      # Make sure the container has git before we do anything else
      - name: Install Git on Container
        if: ${{ matrix.target.container }}
        shell: bash
        run: |
          if [ "${{matrix.target.like}}" == "debian" ]; then
            export DEBIAN_FRONTEND=noninteractive
            if [ "$(dpkg --print-architecture)" = "amd64" ] &&
              grep -qs '^ID=ubuntu$' /etc/os-release; then
              # GitHub's westus Azure runners can intermittently stall on the
              # generic Ubuntu archive. Keep x64 Ubuntu on the local Azure mirror.
              find /etc/apt -maxdepth 2 -type f \
                \( -name sources.list -o -name '*.sources' \) \
                -exec sed -i \
                  -e 's|archive.ubuntu.com|azure.archive.ubuntu.com|g' \
                  -e 's|security.ubuntu.com|azure.archive.ubuntu.com|g' {} +
            fi
            apt_options=(
              -o Acquire::ForceIPv4=true
              -o Acquire::Retries=5
              -o Acquire::http::Timeout=20
              -o Acquire::https::Timeout=20
            )
            # Bound mirror stalls so one hosted runner cannot consume the
            # complete job timeout before the repository is checked out.
            timeout --signal=TERM 180s apt-get "${apt_options[@]}" update -qq
            timeout --signal=TERM 300s apt-get "${apt_options[@]}" install -y -qq git devscripts
          elif [ "${{matrix.target.like}}" == "fedora" ]; then
            dnf install -y git
          elif [ "${{matrix.target.like}}" == "suse" ]; then
            zypper refresh
            zypper install -y --force-resolution git
          elif [ "${{matrix.target.like}}" == "arch" ]; then
            pacman -Syu --noconfirm git
          else
            echo "Unknown: ${{matrix.target.like}}"
          fi
      # Fancy checkout gets all the tags
      # it also makes sure we can use git --describe correctly
      - name: Fancy Checkout
        uses: sithlord48/fancy-checkout@8db15be361005e6d51b0a3b51b39bebd4cde170c # v2

      # This effectively runs `vcvarsall.bat`, etc. It's not actually installing
      # VC++ as that's already pre-installed on the Windows runner.
      - name: Setup VC++ environment
        if: ${{ runner.os == 'Windows' }}
        uses: TheMrMilchmann/setup-msvc-dev@368ef7d1ee4d1171b31d4a7f67f4d954f903f5a9 # v4
        with:
          arch: ${{matrix.target.arch}}
          spectre: true

      - name: Install dependencies
        id: get-deps
        uses: ./.github/actions/install-dependencies
        with:
          qt-version: ${{matrix.target.qt-version}}
          vcpkg-triplet: ${{matrix.target.vcpkg-triplet}}
          like: ${{ matrix.target.like }}

      - name: Configure macOS signing
        if: runner.os == 'macOS'
        shell: bash
        env:
          MACOS_CERTIFICATE_P12_BASE64: ${{ secrets.MACOS_CERTIFICATE_P12_BASE64 }}
          MACOS_CERTIFICATE_PASSWORD: ${{ secrets.MACOS_CERTIFICATE_PASSWORD }}
          MACOS_NOTARY_KEY_BASE64: ${{ secrets.MACOS_NOTARY_KEY_BASE64 }}
          MACOS_NOTARY_KEY_ID: ${{ secrets.MACOS_NOTARY_KEY_ID }}
          MACOS_NOTARY_ISSUER_ID: ${{ secrets.MACOS_NOTARY_ISSUER_ID }}
        run: |
          echo "APPLE_CODESIGN_DISTRIBUTION=" >> "$GITHUB_ENV"
          echo "IEUM_MACOS_NOTARIZE=0" >> "$GITHUB_ENV"

          if [ -z "$MACOS_CERTIFICATE_P12_BASE64" ]; then
            echo "::warning::Building an ad-hoc signed package; Developer ID credentials are not configured"
            exit 0
          fi
          if [ -z "$MACOS_CERTIFICATE_PASSWORD" ]; then
            echo "::error::MACOS_CERTIFICATE_PASSWORD is required with MACOS_CERTIFICATE_P12_BASE64"
            exit 1
          fi

          certificate="$RUNNER_TEMP/ieum-developer-id.p12"
          keychain="$RUNNER_TEMP/ieum-signing.keychain-db"
          keychain_password="$(uuidgen)"
          printf '%s' "$MACOS_CERTIFICATE_P12_BASE64" | base64 -D > "$certificate"
          security create-keychain -p "$keychain_password" "$keychain"
          security set-keychain-settings -lut 21600 "$keychain"
          security unlock-keychain -p "$keychain_password" "$keychain"
          security import "$certificate" \
            -k "$keychain" \
            -P "$MACOS_CERTIFICATE_PASSWORD" \
            -A \
            -t cert \
            -f pkcs12
          security set-key-partition-list \
            -S apple-tool:,apple: \
            -s \
            -k "$keychain_password" \
            "$keychain"
          security list-keychains -d user -s "$keychain"

          identity=$(
            security find-identity -v -p codesigning "$keychain" |
              sed -n 's/.*"\(Developer ID Application:[^"]*\)".*/\1/p' |
              head -1
          )
          if [ -z "$identity" ]; then
            echo "::error::The imported archive has no Developer ID Application identity"
            exit 1
          fi

          echo "APPLE_CODESIGN_DISTRIBUTION=$identity" >> "$GITHUB_ENV"
          echo "IEUM_MACOS_KEYCHAIN=$keychain" >> "$GITHUB_ENV"

          if [ -n "$MACOS_NOTARY_KEY_BASE64" ] &&
             [ -n "$MACOS_NOTARY_KEY_ID" ] &&
             [ -n "$MACOS_NOTARY_ISSUER_ID" ]; then
            echo "IEUM_MACOS_NOTARIZE=1" >> "$GITHUB_ENV"
          else
            echo "::warning::The app will be Developer ID signed but not notarized"
          fi

      - name: Get version
        uses: ./.github/actions/get-version

      - name: Update Windows Paths
        if: (runner.os == 'Windows')
        shell: pwsh
        run: echo "C:\Program Files\doxygen\bin" | Out-File -FilePath $env:GITHUB_PATH -Encoding utf8 -Append

      - name: Configure
        if: runner.os != 'macOS'
        run: ${{env.CMAKE_CONFIGURE}} ${{ matrix.target.config-args }} ${{ steps.get-deps.outputs.vcpkg-cmake-config }} -DPACKAGE_VERSION_LABEL="${{env.IEUM_PACKAGE_VERSION}}"

      - name: Configure macOS
        if: runner.os == 'macOS'
        shell: bash
        run: |
          $CMAKE_CONFIGURE \
            ${{ matrix.target.config-args }} \
            ${{ steps.get-deps.outputs.vcpkg-cmake-config }} \
            -DPACKAGE_VERSION_LABEL="${IEUM_PACKAGE_VERSION}" \
            -DAPPLE_CODESIGN_DISTRIBUTION="${APPLE_CODESIGN_DISTRIBUTION}" \
            -DIEUM_DMG_FINDER_LAYOUT="${{ runner.environment != 'self-hosted' }}"

      - name: Build
        shell: bash
        run: |
          if [[ "${{matrix.target.like}}" != "arch" ]]; then
            if [ "$RUNNER_OS" != "macOS" ]; then
              if ! cmake --build build --config Release -j8 --target package; then
                if [ "$RUNNER_OS" = "Windows" ]; then
                  find build/_CPack_Packages -type f -name wix.log \
                    -print -exec cat {} \; 2>/dev/null || true
                fi
                exit 1
              fi
            else
              cmake --build build --config Release -j8
              package_ok=false
              volume=$(sed -n 's/^set(CPACK_DMG_VOLUME_NAME "\(.*\)")$/\1/p' build/CPackConfig.cmake)
              for i in $(seq 1 5); do
                if cmake --build build --config Release -j8 --target package 2>&1; then
                  echo "Package successful"
                  package_ok=true
                  break
                fi
                echo "Package attempt $i failed"
                if [ -n "$volume" ]; then
                  hdiutil detach "/Volumes/$volume" -force >/dev/null 2>&1 || true
                fi
                sleep "$i"
              done
              [ "$package_ok" = true ]
            fi
          else
            cmake --build build --config Release -j8
            useradd -m build
            sudo chown -R build build
            cd build
            sudo -u build makepkg -s
            export OSNAME=$(cat /etc/os-release | grep ^ID= | sed 's/ID=//g')
            export ARCH=$(uname -m)
            mv *.pkg.tar.zst Ieum-${{env.IEUM_PACKAGE_VERSION}}-${OSNAME}-${ARCH}.pkg.tar.zst
            cd ..
          fi

      - name: Notarize macOS package
        if: runner.os == 'macOS' && env.IEUM_MACOS_NOTARIZE == '1'
        shell: bash
        env:
          MACOS_NOTARY_KEY_BASE64: ${{ secrets.MACOS_NOTARY_KEY_BASE64 }}
          MACOS_NOTARY_KEY_ID: ${{ secrets.MACOS_NOTARY_KEY_ID }}
          MACOS_NOTARY_ISSUER_ID: ${{ secrets.MACOS_NOTARY_ISSUER_ID }}
        run: |
          shopt -s nullglob
          dmgs=(build/Ieum-*.dmg)
          if [ "${#dmgs[@]}" -ne 1 ]; then
            echo "::error::Expected one macOS DMG, found ${#dmgs[@]}"
            exit 1
          fi

          dmg="${dmgs[0]}"
          notary_key="$RUNNER_TEMP/AuthKey_${MACOS_NOTARY_KEY_ID}.p8"
          printf '%s' "$MACOS_NOTARY_KEY_BASE64" | base64 -D > "$notary_key"

          codesign \
            --force \
            --timestamp \
            --sign "$APPLE_CODESIGN_DISTRIBUTION" \
            "$dmg"
          xcrun notarytool submit "$dmg" \
            --key "$notary_key" \
            --key-id "$MACOS_NOTARY_KEY_ID" \
            --issuer "$MACOS_NOTARY_ISSUER_ID" \
            --wait
          xcrun stapler staple "$dmg"
          xcrun stapler validate "$dmg"
          echo "IEUM_MACOS_NOTARIZED=1" >> "$GITHUB_ENV"

      - name: Check for unexpected repo changes
        shell: bash
        run: |
          if [[ `git status --porcelain` ]]; then
            echo "Unexpected changes to the repo, Often caused by forgetting to commit the updated translation files"
            exit 1
          fi

      - name: Tests
        uses: ./.github/actions/run-tests
        timeout-minutes: 2
        with:
          job: ${{ matrix.target.name }}

      - name: Test package
        uses: ./.github/actions/test-package
        with:
          like: ${{ matrix.target.like }}

      - name: Build Korean Windows installer
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          cpack --config build/CPackConfig.cmake -B build -G WIX `
            -D 'CPACK_IEUM_INSTALLER_LOCALE=ko-KR'
          if ($LASTEXITCODE -ne 0) {
            $cpackExitCode = $LASTEXITCODE
            Get-ChildItem build/_CPack_Packages -Recurse -Filter wix.log |
              ForEach-Object {
                Write-Host "::group::$($_.FullName)"
                Get-Content $_.FullName
                Write-Host "::endgroup::"
              }
            exit $cpackExitCode
          }

      - name: Validate Windows installers
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          & .github/actions/test-package/validate-windows-msi.ps1 `
            -BuildDirectory build `
            -ReleaseVersion $env:IEUM_PACKAGE_VERSION

      - name: Test Windows migration and Deskflow coexistence
        if: runner.os == 'Windows'
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $architecture = if ('${{ matrix.target.arch }}' -eq 'amd64') {
            'x64'
          } else {
            'arm64'
          }
          & .github/actions/test-package/test-windows-msi-upgrade.ps1 `
            -BuildDirectory build `
            -Architecture $architecture `
            -CurrentTag '${{ github.ref_name }}' `
            -CurrentPackageVersion $env:IEUM_PACKAGE_VERSION `
            -Repository '${{ github.repository }}'

      - name: Upload development documentation
        if: matrix.target.like == 'arch' && github.event_name == 'push' && github.ref == 'refs/heads/ieum/main'
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: development-documentation
          path: build/docs/dev/html
          if-no-files-found: error
          retention-days: 1

      - name: Upload
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: package-${{ env.PACKAGE_PREFIX }}-${{ matrix.target.name }}
          path: ${{github.workspace}}/build/Ieum[-_]*.*
          retention-days: 1

      - name: Clean up macOS signing keychain
        if: always() && runner.os == 'macOS' && env.IEUM_MACOS_KEYCHAIN != ''
        shell: bash
        run: security delete-keychain "$IEUM_MACOS_KEYCHAIN"

  publish-development-docs:
    needs: main-build
    if: github.event_name == 'push' && github.ref == 'refs/heads/ieum/main'
    runs-on: ubuntu-latest
    permissions:
      actions: read
      contents: write

    steps:
      - name: Checkout without persisted write credentials
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false

      - name: Download development documentation
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8
        with:
          name: development-documentation
          path: build/docs/dev/html

      - name: Publish development documentation
        uses: peaceiris/actions-gh-pages@84c30a85c19949d7eee79c4ff27748b70285e453 # v4
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: build/docs/dev/html
          force_orphan: true

  # Technically, "unix" is a misnomer, but we use it here to mean "Unix-like BSD-derived".
  unix:
    needs: lint-clang
    name: unix-${{ matrix.distro.name }}
    runs-on: ${{ vars.CI_UNIX_RUNNER || 'ubuntu-24.04' }}
    timeout-minutes: 20

    strategy:
      fail-fast: false

      matrix:
        distro:
          - name: freebsd

    steps:
      # Fancy checkout gets all the tags
      # it also makes sure we can use git --describe correctly
      - name: Fancy Checkout
        uses: sithlord48/fancy-checkout@8db15be361005e6d51b0a3b51b39bebd4cde170c # v2
      - name: Build on FreeBSD
        if: ${{ matrix.distro.name == 'freebsd' }}
        uses: vmactions/freebsd-vm@d0518f912576ae759075aa00fb9fe27037940271 # v1
        with:
          usesh: true

          # Workaround for unreliable pkg: Pin to a stable release.
          # vmactions/freebsd-vm@v1 gets latest FreeBSD, which sometimes has a broken ports catalog.
          release: "14.4"

          run: |
            pkg install -y cmake ninja gmake gcc12 openssl glib \
            libX11 libXtst libxkbfile qt6-base qt6-tools gtk3 \
            googletest pkgconf libei libportal doxygen
            ${{env.CMAKE_CONFIGURE}} -G Ninja
            cmake --build build -j16
  flatpak:
    needs: lint-clang
    name: flatpak-${{matrix.flatpak.arch}}
    runs-on: ${{matrix.flatpak.runs-on}}
    timeout-minutes: 60
    container:
      image: ghcr.io/flathub-infra/flatpak-github-actions:kde-6.10
      options: --privileged
    strategy:
      fail-fast: false
      matrix:
        flatpak:
          - runs-on: ubuntu-latest
            arch: x86_64
          - runs-on: ubuntu-24.04-arm
            arch: aarch64
    steps:
      - name: Check out repository
        uses: sithlord48/fancy-checkout@8db15be361005e6d51b0a3b51b39bebd4cde170c # v2

      - run: git config --global protocol.file.allow always

      - name: Get version
        uses: ./.github/actions/get-version

      - name: Lint appsteam
        run: flatpak-builder-lint appstream deploy/linux/org.deskflow.deskflow.metainfo.xml

      - name: Lint manifest
        run: flatpak-builder-lint manifest deploy/linux/flatpak/org.deskflow.deskflow.yml

      - name: Build
        uses: flatpak/flatpak-github-actions/flatpak-builder@401fe28a8384095fc1531b9d320b292f0ee45adb # v6
        with:
          bundle: Ieum-${{env.IEUM_PACKAGE_VERSION}}-linux-${{matrix.flatpak.arch}}.flatpak
          manifest-path: deploy/linux/flatpak/org.deskflow.deskflow.yml
          cache-key: flatpak-builder-${{matrix.flatpak.arch}}-2.0
          arch: ${{matrix.flatpak.arch}}
          upload-artifact: false

      - name: Validate build
        run: flatpak-builder-lint --exceptions --user-exceptions deploy/linux/flatpak/ci-build-lint-exceptions.json repo repo

      - name: Upload
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: package-${{ env.PACKAGE_PREFIX }}-flatpak-${{matrix.flatpak.arch}}
          path: ${{github.workspace}}/Ieum[-_]*.flatpak
          retention-days: 1

  release:
    needs: ci-passed
    if: ${{ always() && needs.ci-passed.result == 'success' && startsWith(github.ref, 'refs/tags/v') }}
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Fancy Checkout
        uses: sithlord48/fancy-checkout@8db15be361005e6d51b0a3b51b39bebd4cde170c # v2

      - name: Materialize private deny map
        shell: bash
        env:
          DENY_MAP_B64: ${{ secrets.IEUM_PRIVATE_DENY_MAP_B64 }}
          DENY_MAP_SHA256: ${{ secrets.IEUM_PRIVATE_DENY_MAP_SHA256 }}
        run: |
          set -euo pipefail
          [[ -n "$DENY_MAP_B64" && "$DENY_MAP_SHA256" =~ ^[0-9a-f]{64}$ ]] || exit 1
          deny_map="$RUNNER_TEMP/ieum-private-deny-map.json"
          printf '%s' "$DENY_MAP_B64" | base64 --decode > "$deny_map"
          chmod 600 "$deny_map"
          printf 'IEUM_PRIVATE_DENY_MAP=%s\n' "$deny_map" >> "$GITHUB_ENV"
          printf 'IEUM_PRIVATE_DENY_MAP_SHA256=%s\n' "$DENY_MAP_SHA256" >> "$GITHUB_ENV"

      - name: Get version
        uses: ./.github/actions/get-version

      - name: Download artifacts
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8

      - name: Generate package checksums
        shell: bash
        run: |
          shopt -s nullglob

          downloaded_packages=("$GITHUB_WORKSPACE"/package-*/Ieum-*)
          if (( ${#downloaded_packages[@]} == 0 )); then
            echo "::error::No Ieum release packages were downloaded"
            exit 1
          fi

          mv -- "${downloaded_packages[@]}" .
          rm -rf -- "$GITHUB_WORKSPACE"/package-*

          mapfile -t release_packages < <(
            find . -maxdepth 1 -type f -name 'Ieum-*' -printf '%f\n' |
              LC_ALL=C sort
          )
          if (( ${#release_packages[@]} == 0 )); then
            echo "::error::No Ieum release packages are ready for publication"
            exit 1
          fi

          : > SHA256SUMS.txt
          for package in "${release_packages[@]}"; do
            sha256sum -- "$package" >> SHA256SUMS.txt
          done

          # Keep the manifest directly consumable by `sha256sum --check` and
          # ensure it describes every publishable package exactly once.
          sha256sum --check --strict SHA256SUMS.txt
          mapfile -t manifest_packages < <(
            sed -nE 's/^[0-9a-fA-F]{64}  //p' SHA256SUMS.txt |
              LC_ALL=C sort
          )
          diff -u \
            <(printf '%s\n' "${release_packages[@]}") \
            <(printf '%s\n' "${manifest_packages[@]}")

      - name: Freeze release body, refs, source archives, and response identities
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          evidence="$RUNNER_TEMP/privacy-release-pre"
          mkdir -p "$evidence"

          gh api \
            --method POST \
            "repos/$GITHUB_REPOSITORY/releases/generate-notes" \
            -f "tag_name=$GITHUB_REF_NAME" \
            -f "target_commitish=$GITHUB_SHA" > "$evidence/generated-notes.json"
          python3 - "$evidence/generated-notes.json" "$evidence/generated-notes.md" "$evidence/final-release-body.md" <<'PY'
          import json
          import pathlib
          import sys

          source, notes_path, body_path = map(pathlib.Path, sys.argv[1:])
          payload = json.loads(source.read_text(encoding="utf-8"))
          body = payload.get("body")
          if not isinstance(body, str):
              raise SystemExit("generated release notes body is missing")
          notes_path.write_text(body, encoding="utf-8", newline="\n")
          sponsorship = pathlib.Path("docs/release/sponsorship-impact.md").read_text(encoding="utf-8")
          body_path.write_text(sponsorship.rstrip() + "\n\n" + body.lstrip(), encoding="utf-8", newline="\n")
          PY

          git ls-remote --refs "https://github.com/$GITHUB_REPOSITORY.git" |
            LC_ALL=C sort -u > "$evidence/expected-refs.txt"
          [[ -s "$evidence/expected-refs.txt" ]]

          for kind in tar.gz zip; do
            url="https://github.com/$GITHUB_REPOSITORY/archive/refs/tags/$GITHUB_REF_NAME.$kind"
            curl --fail --silent --show-error --location \
              --proto '=https' --proto-redir '=https' --retry 3 \
              --dump-header "$evidence/source-$kind.headers" \
              --write-out '%{json}\n' \
              --output "$evidence/source-$kind" \
              "$url" > "$evidence/source-$kind.response.json"
          done

      - name: Run exact release privacy gate
        shell: bash
        run: |
          set -euo pipefail
          evidence="$RUNNER_TEMP/privacy-release-pre"
          mapfile -t release_packages < <(
            find . -maxdepth 1 -type f -name 'Ieum-*' -printf '%f\n' | LC_ALL=C sort
          )
          args=(
            release
            --deny-map "$IEUM_PRIVATE_DENY_MAP"
            --deny-map-sha256 "$IEUM_PRIVATE_DENY_MAP_SHA256"
            --manifest-out "$evidence/public-surface-manifest.json"
            --body "$evidence/final-release-body.md"
            --generated-notes "$evidence/generated-notes.md"
            --checksum SHA256SUMS.txt
            --source-archive "$evidence/source-tar.gz"
            --source-archive "$evidence/source-zip"
            --response-record "$evidence/source-tar.gz.headers"
            --response-record "$evidence/source-tar.gz.response.json"
            --response-record "$evidence/source-zip.headers"
            --response-record "$evidence/source-zip.response.json"
          )
          for package in "${release_packages[@]}"; do
            args+=(--package "$package")
          done
          python3 tools/privacy/public_privacy_guard.py "${args[@]}"

      - name: Preserve pre-release privacy evidence for post-fetch
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: privacy-release-pre-${{ github.run_id }}
          path: ${{ runner.temp }}/privacy-release-pre
          if-no-files-found: error
          retention-days: 30

      - name: Deploy release
        uses: softprops/action-gh-release@3d0d9888cb7fd7b750713d6e236d1fcb99157228 # v3
        with:
          token: "${{ secrets.GITHUB_TOKEN }}"
          name: "이음 (Ieum) ${{ github.ref_name }}"
          body_path: ${{ runner.temp }}/privacy-release-pre/final-release-body.md
          generate_release_notes: false
          make_latest: ${{ !contains(github.ref_name, '-') }}
          prerelease: ${{ contains(github.ref_name, '-') }}
          files: |
            Ieum-*
            SHA256SUMS.txt

  privacy-post-fetch:
    needs: release
    if: ${{ always() && needs.release.result == 'success' && startsWith(github.ref, 'refs/tags/v') }}
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: read

    steps:
      - name: Checkout complete history
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Download frozen pre-release evidence
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8
        with:
          name: privacy-release-pre-${{ github.run_id }}
          path: ${{ runner.temp }}/privacy-release-pre

      - name: Materialize private deny map
        shell: bash
        env:
          DENY_MAP_B64: ${{ secrets.IEUM_PRIVATE_DENY_MAP_B64 }}
          DENY_MAP_SHA256: ${{ secrets.IEUM_PRIVATE_DENY_MAP_SHA256 }}
        run: |
          set -euo pipefail
          [[ -n "$DENY_MAP_B64" && "$DENY_MAP_SHA256" =~ ^[0-9a-f]{64}$ ]] || exit 1
          deny_map="$RUNNER_TEMP/ieum-private-deny-map.json"
          printf '%s' "$DENY_MAP_B64" | base64 --decode > "$deny_map"
          chmod 600 "$deny_map"
          printf 'IEUM_PRIVATE_DENY_MAP=%s\n' "$deny_map" >> "$GITHUB_ENV"
          printf 'IEUM_PRIVATE_DENY_MAP_SHA256=%s\n' "$DENY_MAP_SHA256" >> "$GITHUB_ENV"

      - name: Download and bind live Release bytes
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          pre="$RUNNER_TEMP/privacy-release-pre"
          live="$RUNNER_TEMP/privacy-release-live"
          mkdir -p "$live/assets"

          gh api "repos/$GITHUB_REPOSITORY/releases/tags/$GITHUB_REF_NAME" > "$live/release.json"
          gh api --include "repos/$GITHUB_REPOSITORY/releases/tags/$GITHUB_REF_NAME" > "$live/release.response.txt"
          python3 - "$live/release.json" "$live/body.md" <<'PY'
          import json
          import pathlib
          import sys

          source, output = map(pathlib.Path, sys.argv[1:])
          body = json.loads(source.read_text(encoding="utf-8")).get("body")
          if not isinstance(body, str):
              raise SystemExit("live Release body is missing")
          output.write_text(body, encoding="utf-8", newline="\n")
          PY
          cmp -- "$pre/final-release-body.md" "$live/body.md"
          gh release download "$GITHUB_REF_NAME" --repo "$GITHUB_REPOSITORY" --dir "$live/assets"

          for kind in tar.gz zip; do
            url="https://github.com/$GITHUB_REPOSITORY/archive/refs/tags/$GITHUB_REF_NAME.$kind"
            curl --fail --silent --show-error --location \
              --proto '=https' --proto-redir '=https' --retry 3 \
              --dump-header "$live/source-$kind.headers" \
              --write-out '%{json}\n' \
              --output "$live/source-$kind" \
              "$url" > "$live/source-$kind.response.json"
          done

      - name: Run post-fetch ref and byte verification
        shell: bash
        env:
          FROZEN_BASELINE_SHA: ${{ secrets.IEUM_PRIVACY_BASELINE_SHA }}
        run: |
          set -euo pipefail
          [[ "$FROZEN_BASELINE_SHA" =~ ^[0-9a-f]{40}$|^[0-9a-f]{64}$ ]] || exit 1
          pre="$RUNNER_TEMP/privacy-release-pre"
          live="$RUNNER_TEMP/privacy-release-live"
          mapfile -t release_packages < <(
            find "$live/assets" -maxdepth 1 -type f -name 'Ieum-*' -print | LC_ALL=C sort
          )
          [[ ${#release_packages[@]} -gt 0 ]]
          args=(
            post-fetch
            --deny-map "$IEUM_PRIVATE_DENY_MAP"
            --deny-map-sha256 "$IEUM_PRIVATE_DENY_MAP_SHA256"
            --manifest-out "$live/public-surface-manifest.json"
            --remote "https://github.com/$GITHUB_REPOSITORY.git"
            --expected-ref-map "$pre/expected-refs.txt"
            --ref "$GITHUB_REF"
            --baseline "$FROZEN_BASELINE_SHA"
            --body "$live/body.md"
            --generated-notes "$pre/generated-notes.md"
            --checksum "$live/assets/SHA256SUMS.txt"
            --source-archive "$live/source-tar.gz"
            --source-archive "$live/source-zip"
            --response-record "$live/release.response.txt"
            --response-record "$live/source-tar.gz.headers"
            --response-record "$live/source-tar.gz.response.json"
            --response-record "$live/source-zip.headers"
            --response-record "$live/source-zip.response.json"
          )
          for package in "${release_packages[@]}"; do
            args+=(--package "$package")
          done
          python3 tools/privacy/public_privacy_guard.py "${args[@]}"

      - name: Preserve post-fetch privacy evidence
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: privacy-release-post-${{ github.run_id }}
          path: ${{ runner.temp }}/privacy-release-live
          if-no-files-found: error
          retention-days: 30
