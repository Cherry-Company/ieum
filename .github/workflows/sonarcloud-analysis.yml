name: "SonarCloud Analysis"

# This is best run as a standalone workflow, not as part of another workflow like CI
# because of how GitHub understands the code scanning workflows in it's UI.
on:
  workflow_dispatch:
  pull_request:
    paths:
      - '.github/workflows/sonarcloud-analysis.yml'
      - 'sonar-project.properties'
      - 'cmake/Libraries.cmake'
      - 'CMakeLists.txt'
      - 'src/**'
      - '!src/res/**'
      - '!src/unittests/**'
  push:
    branches: ["ieum/main"]
    paths:
      - '.github/workflows/sonarcloud-analysis.yml'
      - 'sonar-project.properties'
      - 'cmake/Libraries.cmake'
      - 'CMakeLists.txt'
      - 'src/**'
      - '!src/res/**'
      - '!src/unittests/**'

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  sonar:
    runs-on: ubuntu-latest
    container: debian:trixie-slim
    timeout-minutes: 20

    env:
      CPU_CORE_COUNT: 4

    steps:
      - name: Check SonarCloud configuration
        id: configuration
        shell: bash
        env:
          SONAR_SCANNER_ENABLED: ${{ vars.SONAR_SCANNER_ENABLED }}
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
        run: |
          set -euo pipefail

          run_analysis=false
          if [[ "$SONAR_SCANNER_ENABLED" != "true" ]]; then
            reason="repository variable SONAR_SCANNER_ENABLED is not true"
          elif [[ -z "$SONAR_TOKEN" ]]; then
            reason="repository secret SONAR_TOKEN is not configured for this event"
          else
            run_analysis=true
            reason="repository variable and secret are configured"
          fi

          printf 'run_analysis=%s\n' "$run_analysis" >> "$GITHUB_OUTPUT"
          if [[ "$run_analysis" == "true" ]]; then
            echo "::notice title=SonarCloud analysis enabled::$reason"
            printf '### SonarCloud analysis\n\nEnabled: %s.\n' "$reason" >> "$GITHUB_STEP_SUMMARY"
          else
            echo "::notice title=SonarCloud analysis skipped::$reason"
            printf '### SonarCloud analysis\n\nSkipped intentionally: %s.\n' "$reason" >> "$GITHUB_STEP_SUMMARY"
          fi

      - name: Install container dependencies
        if: ${{ steps.configuration.outputs.run_analysis == 'true' }}
        run: |
          apt update -qqq > /dev/null
          apt install -qqq git curl unzip gcovr dirmngr gpg > /dev/null

      - name: Fancy Checkout
        if: ${{ steps.configuration.outputs.run_analysis == 'true' }}
        uses: sithlord48/fancy-checkout@8db15be361005e6d51b0a3b51b39bebd4cde170c # v2

      - name: Install project dependencies
        if: ${{ steps.configuration.outputs.run_analysis == 'true' }}
        uses: ./.github/actions/install-dependencies
        with:
          like: "debian"

      - name: Install Build Wrapper
        if: ${{ steps.configuration.outputs.run_analysis == 'true' }}
        uses: SonarSource/sonarqube-scan-action/install-build-wrapper@22918119ff8e1ca75a623e15c8296b6ea4fbe28f # v8

      - name: Configure
        if: ${{ steps.configuration.outputs.run_analysis == 'true' }}
        run: |
          cmake -B build \
            -G "Ninja" \
            -DCMAKE_BUILD_TYPE="Debug" \
            -DCMAKE_EXPORT_COMPILE_COMMANDS=ON \
            -DSKIP_BUILD_TESTS=ON \
            -DENABLE_COVERAGE=ON

      - name: Build
        if: ${{ steps.configuration.outputs.run_analysis == 'true' }}
        run: |
          build-wrapper-linux-x86-64 --out-dir bw-output cmake --build build -j${CPU_CORE_COUNT}

      - name: Test coverage
        if: ${{ steps.configuration.outputs.run_analysis == 'true' }}
        shell: bash
        env:
          QT_QPA_PLATFORM: offscreen
        run: |
          tests=(`cmake --build build  --target help | grep -o "^coverage-[^:]*"`)
          for i in "${tests[@]}"; do
            cmake --build build --target "$i"
          done

      - name: Get coverage report paths
        if: ${{ steps.configuration.outputs.run_analysis == 'true' }}
        id: coverage-paths
        run: |
          paths=$(ls -w 0 -m build/coverage-*.xml | sed 's/ //g')
          if [ -z "$paths" ]; then
            echo "Error: No coverage files found"
            exit 1
          fi
          echo "csv=$paths" >> $GITHUB_OUTPUT

      - name: SonarQube Scan
        if: ${{ steps.configuration.outputs.run_analysis == 'true' }}
        uses: SonarSource/sonarqube-scan-action@22918119ff8e1ca75a623e15c8296b6ea4fbe28f # v8
        with:
          args: >
            -Dsonar.coverageReportPaths=${{ steps.coverage-paths.outputs.csv }}
            -Dsonar.cfamily.threads=${{ env.CPU_CORE_COUNT }}
        env:
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
