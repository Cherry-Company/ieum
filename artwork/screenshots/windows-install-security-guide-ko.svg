<svg xmlns="http://www.w3.org/2000/svg" width="1440" height="820" viewBox="0 0 1440 820" role="img" aria-labelledby="title desc">
  <title id="title">이음 Windows 설치 중 보안 화면 안내</title>
  <desc id="desc">SmartScreen, 사용자 계정 컨트롤, 설치 중단 조건을 설명하는 개인정보 없는 재구성 화면</desc>
  <defs>
    <style>
      .ui { font-family: "Pretendard", "Noto Sans KR", "Malgun Gothic", "Segoe UI", sans-serif; letter-spacing: 0; }
      .title { font-size: 36px; font-weight: 700; fill: #17212b; }
      .subtitle { font-size: 19px; fill: #4b5968; }
      .step { font-size: 16px; font-weight: 700; fill: #ffffff; }
      .card-title { font-size: 25px; font-weight: 700; fill: #17212b; }
      .body { font-size: 18px; fill: #334252; }
      .small { font-size: 15px; fill: #566575; }
      .button { font-size: 17px; font-weight: 650; fill: #ffffff; }
      .status { font-size: 15px; font-weight: 700; }
    </style>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="150%">
      <feDropShadow dx="0" dy="8" stdDeviation="12" flood-color="#17212b" flood-opacity="0.12"/>
    </filter>
  </defs>

  <rect width="1440" height="820" fill="#f5f7f8"/>
  <g class="ui">
    <text x="72" y="78" class="title">Windows 설치 중 보이는 보안 화면</text>
    <text x="72" y="112" class="subtitle">보호 기능을 끄지 말고, 파일 이름과 SHA-256이 맞을 때만 다음 단계로 진행하세요.</text>

    <g transform="translate(72 154)" filter="url(#shadow)">
      <rect width="408" height="520" rx="8" fill="#ffffff" stroke="#d8dee5"/>
      <rect width="408" height="54" rx="8" fill="#2667c9"/>
      <rect y="46" width="408" height="8" fill="#2667c9"/>
      <circle cx="31" cy="27" r="16" fill="#ffffff" fill-opacity="0.2"/>
      <text x="26" y="33" class="step">1</text>
      <text x="58" y="34" class="step">SmartScreen</text>

      <rect x="28" y="82" width="352" height="180" rx="8" fill="#eef5ff" stroke="#b9d3f5"/>
      <path d="M63 115 l22 0 13 22 -13 22 -22 0 -13 -22z" fill="#2667c9"/>
      <path d="M68 132 h12 v4 h-12z M72 122 h4 v8 h-4z" fill="#ffffff"/>
      <text x="114" y="126" class="card-title">Windows의 PC 보호</text>
      <text x="114" y="158" class="body">인식할 수 없는 앱의 시작을</text>
      <text x="114" y="184" class="body">차단했습니다.</text>
      <text x="52" y="230" class="small">현재 알파는 코드 서명 전이라 표시될 수 있습니다.</text>

      <rect x="28" y="286" width="114" height="42" rx="6" fill="#2667c9"/>
      <text x="50" y="313" class="button">추가 정보</text>
      <rect x="152" y="286" width="96" height="42" rx="6" fill="#2667c9"/>
      <text x="173" y="313" class="button">실행</text>

      <circle cx="42" cy="370" r="10" fill="#22946f"/>
      <path d="M37 370 l4 4 7 -9" fill="none" stroke="#ffffff" stroke-width="3" stroke-linecap="round"/>
      <text x="62" y="376" class="body">공식 릴리스 파일</text>
      <circle cx="42" cy="412" r="10" fill="#22946f"/>
      <path d="M37 412 l4 4 7 -9" fill="none" stroke="#ffffff" stroke-width="3" stroke-linecap="round"/>
      <text x="62" y="418" class="body">SHA-256 일치</text>
      <circle cx="42" cy="454" r="10" fill="#e09a22"/>
      <text x="38" y="460" class="status" fill="#ffffff">!</text>
      <text x="62" y="460" class="body">둘 다 확인한 뒤에만 실행</text>
    </g>

    <g transform="translate(516 154)" filter="url(#shadow)">
      <rect width="408" height="520" rx="8" fill="#ffffff" stroke="#d8dee5"/>
      <rect width="408" height="54" rx="8" fill="#267a69"/>
      <rect y="46" width="408" height="8" fill="#267a69"/>
      <circle cx="31" cy="27" r="16" fill="#ffffff" fill-opacity="0.2"/>
      <text x="26" y="33" class="step">2</text>
      <text x="58" y="34" class="step">사용자 계정 컨트롤(UAC)</text>

      <rect x="28" y="82" width="352" height="210" rx="8" fill="#f0f8f5" stroke="#b8d9d0"/>
      <rect x="52" y="108" width="54" height="54" rx="8" fill="#1e2933"/>
      <circle cx="79" cy="135" r="17" fill="none" stroke="#64d4c4" stroke-width="6"/>
      <circle cx="79" cy="135" r="7" fill="#ffffff"/>
      <text x="124" y="126" class="card-title">이 앱이 변경하도록</text>
      <text x="124" y="157" class="card-title">허용하시겠습니까?</text>
      <text x="52" y="202" class="body">앱: 이음 (Ieum) 설치 프로그램</text>
      <text x="52" y="232" class="body">게시자: 알 수 없음</text>
      <text x="52" y="263" class="small">코드 서명 전 알파 패키지의 현재 표시</text>

      <text x="28" y="334" class="body">승인하면 설치 프로그램이 다음을 등록합니다.</text>
      <circle cx="42" cy="372" r="5" fill="#267a69"/>
      <text x="58" y="378" class="body">C:\Program Files\Ieum</text>
      <circle cx="42" cy="410" r="5" fill="#267a69"/>
      <text x="58" y="416" class="body">Ieum 백그라운드 서비스</text>
      <circle cx="42" cy="448" r="5" fill="#267a69"/>
      <text x="58" y="454" class="body">ieum-core.exe 방화벽 프로그램 예외</text>
      <text x="28" y="492" class="small">방화벽 자체를 끄거나 보안 설정을 낮추지 않습니다.</text>
    </g>

    <g transform="translate(960 154)" filter="url(#shadow)">
      <rect width="408" height="520" rx="8" fill="#ffffff" stroke="#d8dee5"/>
      <rect width="408" height="54" rx="8" fill="#bd3d43"/>
      <rect y="46" width="408" height="8" fill="#bd3d43"/>
      <circle cx="31" cy="27" r="16" fill="#ffffff" fill-opacity="0.2"/>
      <text x="26" y="33" class="step">3</text>
      <text x="58" y="34" class="step">이때는 설치 중단</text>

      <circle cx="204" cy="139" r="50" fill="#fff0f0" stroke="#e4a6aa" stroke-width="2"/>
      <path d="M183 118 l42 42 M225 118 l-42 42" stroke="#bd3d43" stroke-width="10" stroke-linecap="round"/>
      <text x="48" y="222" class="card-title">진행하지 마세요</text>
      <circle cx="48" cy="265" r="6" fill="#bd3d43"/>
      <text x="66" y="272" class="body">SHA-256이 체크섬 파일과 다름</text>
      <circle cx="48" cy="311" r="6" fill="#bd3d43"/>
      <text x="66" y="318" class="body">Defender가 악성코드로 진단함</text>
      <circle cx="48" cy="357" r="6" fill="#bd3d43"/>
      <text x="66" y="364" class="body">파일명이 릴리스 목록과 다름</text>
      <circle cx="48" cy="403" r="6" fill="#bd3d43"/>
      <text x="66" y="410" class="body">GitHub 이외의 출처에서 받음</text>

      <rect x="28" y="448" width="352" height="48" rx="6" fill="#fff0f0" stroke="#e4a6aa"/>
      <text x="58" y="479" class="status" fill="#a62f35">허용 목록 추가나 보안 기능 해제를 하지 마세요.</text>
    </g>

    <rect x="72" y="708" width="1296" height="64" rx="8" fill="#ffffff" stroke="#d8dee5"/>
    <circle cx="108" cy="740" r="13" fill="#22946f"/>
    <path d="M102 740 l5 5 9 -11" fill="none" stroke="#ffffff" stroke-width="3" stroke-linecap="round"/>
    <text x="134" y="747" class="body">정상 설치에는 SmartScreen, Defender, UAC를 끄는 과정이 없습니다. 확인할 것은 출처와 SHA-256입니다.</text>
  </g>
</svg>
